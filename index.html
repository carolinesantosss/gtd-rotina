<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://sheets.googleapis.com https://fonts.googleapis.com https://fonts.gstatic.com; connect-src *;">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>GTD + Rotina</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f1117;--surf:#161b27;--surfH:#1e2535;--bord:#2a3348;
  --text:#e8eaf0;--mid:#8892a4;--dim:#4a5568;
  --acc:#6c8ef5;--accD:rgba(108,142,245,.14);
  --pink:#e879a0;--pinkD:rgba(232,121,160,.14);
  --grn:#4ade80;--grnD:rgba(74,222,128,.14);
  --amb:#fbbf24;--ambD:rgba(251,191,36,.14);
  --red:#f87171;--redD:rgba(248,113,113,.14);
  --ctx:#a78bfa;--ctxD:rgba(167,139,250,.14);
  --r:12px;--r-sm:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior:none}
#app{max-width:430px;margin:0 auto;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;position:relative}

/* ── TopBar ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:13px 15px 10px;border-bottom:1px solid var(--bord);background:var(--surf);position:sticky;top:0;z-index:30;gap:10px}
.topbar-title{font-size:16px;font-weight:600;flex:1}
.topbar-badge{font-size:11px;background:var(--ambD);color:var(--amb);border-radius:20px;padding:2px 9px;font-weight:600}
.sync-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);border:1px solid var(--bord);background:transparent;color:var(--mid);cursor:pointer;font-size:15px;flex-shrink:0}
.sync-btn.syncing{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Content ── */
.content{flex:1;overflow-y:auto;padding:13px 14px 90px;-webkit-overflow-scrolling:touch}

/* ── Nav ── */
.nav{display:flex;background:var(--surf);border-top:1px solid var(--bord);position:sticky;bottom:0;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;cursor:pointer;font-size:9px;font-weight:500;color:var(--dim);border:none;background:none;transition:color .15s;position:relative}
.nb.on{color:var(--acc)}
.nb i{font-size:20px}
.nb .dot{position:absolute;top:5px;right:calc(50% - 14px);width:7px;height:7px;background:var(--red);border-radius:50%;border:1.5px solid var(--surf)}

/* ── Cards ── */
.card{background:var(--surf);border:1px solid var(--bord);border-radius:var(--r);padding:13px;margin-bottom:10px}
.card-l{border-left:3px solid var(--acc);border-radius:0 var(--r) var(--r) 0}

/* ── Pills ── */
.pill{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.p-acc{background:var(--accD);color:var(--acc)}
.p-pink{background:var(--pinkD);color:var(--pink)}
.p-grn{background:var(--grnD);color:var(--grn)}
.p-amb{background:var(--ambD);color:var(--amb)}
.p-red{background:var(--redD);color:var(--red)}
.p-ctx{background:var(--ctxD);color:var(--ctx)}
.p-gray{background:var(--surfH);color:var(--mid)}

/* ── Buttons ── */
.btn{border:none;border-radius:var(--r-sm);padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;transition:opacity .15s}
.btn:active{opacity:.75}
.btn-p{background:var(--acc);color:#fff}
.btn-g{background:transparent;border:1px solid var(--bord);color:var(--mid)}
.btn-grn{background:var(--grn);color:#000}
.btn-red{background:transparent;border:1px solid var(--bord);color:var(--red)}
.btn-sm{padding:5px 11px;font-size:11px}

/* ── Inputs ── */
.inp{width:100%;border:1px solid var(--bord);border-radius:var(--r-sm);padding:9px 11px;font-size:14px;background:var(--surfH);color:var(--text);outline:none;font-family:inherit;transition:border-color .15s}
.inp:focus{border-color:var(--acc)}
.sel{width:100%;border:1px solid var(--bord);border-radius:var(--r-sm);padding:9px 11px;font-size:13px;background:var(--surfH);color:var(--text);outline:none;font-family:inherit;cursor:pointer}
.lbl{font-size:10px;font-weight:600;color:var(--dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;display:block}
.fld{margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── Section label ── */
.sec{font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;margin:16px 0 8px;display:flex;align-items:center;gap:5px}

/* ── Chips row ── */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;border:1px solid var(--bord);background:transparent;color:var(--mid);font-family:inherit;transition:all .15s}
.chip.on{background:var(--accD);color:var(--acc);border-color:var(--acc)}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surf);border-radius:16px 16px 0 0;padding:18px 16px 24px;width:100%;max-width:430px;max-height:92vh;overflow-y:auto}
.modal-handle{width:36px;height:4px;background:var(--bord);border-radius:2px;margin:0 auto 15px}
.modal-title{font-size:15px;font-weight:700;margin-bottom:16px}

/* ── Progress ── */
.pbar{height:5px;background:var(--bord);border-radius:5px;overflow:hidden}
.pfill{height:100%;border-radius:5px;background:var(--acc);transition:width .4s}

/* ── Checklist ── */
.ci{display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid var(--bord);border-radius:var(--r-sm);margin-bottom:5px;cursor:pointer;transition:all .15s}
.ci.done{background:var(--grnD);border-color:rgba(74,222,128,.3)}
.ci.done span{text-decoration:line-through;color:var(--mid)}
.cbox{width:17px;height:17px;min-width:17px;border-radius:4px;border:1.5px solid var(--bord);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.cbox.tk{background:var(--grn);border-color:var(--grn);color:#000}

/* ── Circ btn ── */
.circ{width:20px;height:20px;min-width:20px;border-radius:50%;border:1.5px solid var(--bord);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;flex-shrink:0}
.circ.done{background:var(--grn);border-color:var(--grn);color:#000}

/* ── Water ── */
.cup{width:30px;height:30px;border-radius:6px;border:1.5px solid var(--acc);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:background .2s;user-select:none}
.cup.full{background:var(--acc)}
.cup.empty{background:transparent}

/* ── Ticker ── */
.ticker-wrap{overflow:hidden;border-top:1px solid var(--bord);border-bottom:1px solid var(--bord);padding:7px 0;margin-bottom:13px;background:var(--surfH)}
.ticker-inner{display:flex;white-space:nowrap;animation:ticker 26s linear infinite}
.ticker-inner:hover{animation-play-state:paused}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.tick-item{display:inline-flex;align-items:center;gap:7px;padding:0 18px;font-size:12px;color:var(--mid)}
.tick-item b{color:var(--text);font-weight:600}

/* ── Misc ── */
.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.rowb{display:flex;align-items:center;justify-content:space-between;gap:8px}
.iname{font-size:13px;font-weight:600;line-height:1.35;margin-bottom:4px}
.imeta{font-size:11px;color:var(--mid)}
.empty{text-align:center;padding:40px 20px;color:var(--mid)}
.stat{background:var(--surfH);border-radius:var(--r-sm);padding:11px 13px}
.stat .v{font-size:26px;font-weight:600;line-height:1}
.stat .l{font-size:11px;color:var(--mid);margin-top:3px}

/* ── Setup screen ── */
.setup{padding:24px 20px;max-width:430px;margin:0 auto}
.setup h2{font-size:20px;font-weight:700;margin-bottom:6px}
.setup p{font-size:13px;color:var(--mid);line-height:1.6;margin-bottom:14px}
.setup .step{display:flex;gap:12px;margin-bottom:20px;padding:14px;background:var(--surf);border:1px solid var(--bord);border-radius:var(--r)}
.setup .step-num{width:26px;height:26px;min-width:26px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px}
.setup .step-body{flex:1}
.setup .step-title{font-size:13px;font-weight:600;margin-bottom:4px}
.setup .step-desc{font-size:12px;color:var(--mid);line-height:1.5}
.setup code{background:var(--surfH);border:1px solid var(--bord);border-radius:4px;padding:1px 5px;font-size:11px;font-family:monospace;color:var(--acc);word-break:break-all}
.copy-btn{background:var(--accD);color:var(--acc);border:none;border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer;margin-left:5px;font-family:inherit}

/* ── Spinner overlay ── */
.loading-overlay{position:fixed;inset:0;background:rgba(15,17,23,.85);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.spinner{width:36px;height:36px;border:3px solid var(--bord);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite}
.loading-msg{font-size:13px;color:var(--mid)}

/* ── Pomodoro floating panel ── */
.pomo-fab{position:fixed;bottom:calc(86px + 12px);right:calc(50% - 215px + 12px);width:44px;height:44px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:20px;cursor:pointer;z-index:50;box-shadow:0 4px 16px rgba(248,113,113,.4);display:flex;align-items:center;justify-content:center;transition:transform .2s}
.pomo-fab:active{transform:scale(.92)}
.pomo-fab.running{background:var(--grn);box-shadow:0 4px 16px rgba(74,222,128,.4);animation:pomo-pulse 2s ease-in-out infinite}
.pomo-fab.break{background:var(--acc);box-shadow:0 4px 16px rgba(108,142,245,.4)}
@keyframes pomo-pulse{0%,100%{box-shadow:0 4px 16px rgba(74,222,128,.4)}50%{box-shadow:0 4px 28px rgba(74,222,128,.7)}}

.pomo-panel{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--surf);border-radius:20px 20px 0 0;border-top:1px solid var(--bord);z-index:80;padding:16px 18px 24px;box-shadow:0 -8px 32px rgba(0,0,0,.4);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.pomo-panel.hidden{transform:translateX(-50%) translateY(100%)}

.pomo-ring-wrap{position:relative;width:140px;height:140px;margin:0 auto 14px}
.pomo-ring-wrap svg{transform:rotate(-90deg)}
.pomo-ring-bg{fill:none;stroke:var(--bord);stroke-width:8}
.pomo-ring-fill{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .9s linear,stroke .3s}
.pomo-time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pomo-time .t{font-size:30px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.pomo-time .lbl{font-size:10px;color:var(--mid);font-weight:600;text-transform:uppercase;letter-spacing:.5px}

.pomo-task{font-size:13px;font-weight:600;text-align:center;margin-bottom:6px;color:var(--text);min-height:20px;padding:0 8px}
.pomo-count{text-align:center;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.pomo-dot{width:10px;height:10px;border-radius:50%;background:var(--bord)}
.pomo-dot.done{background:var(--red)}
.pomo-dot.break-done{background:var(--acc)}

.pomo-controls{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.pomo-hist{max-height:140px;overflow-y:auto;border-top:1px solid var(--bord);padding-top:10px}
.pomo-hist-item{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bord);font-size:12px}
.pomo-hist-item:last-child{border-bottom:none}
</style>
</head>

<script>
// ═══════════════════════════════════════════════════════
// CONFIG — preenchida pelo usuário na primeira abertura
// ═══════════════════════════════════════════════════════
const CFG_KEY = "gtd_config_v1";
let CFG = {};

try { CFG = JSON.parse(localStorage.getItem(CFG_KEY)||"{}"); } catch {}

// ═══════════════════════════════════════════════════════
// GOOGLE SHEETS API
// ═══════════════════════════════════════════════════════
const SHEETS_URL = id => `https://sheets.googleapis.com/v4/spreadsheets/${id}`;

async function sheetsGet(range) {
  // Use OAuth token if available, fall back to API key for public sheets
  const headers = {};
  if (CFG.accessToken) headers["Authorization"] = `Bearer ${CFG.accessToken}`;
  const keyParam = CFG.accessToken ? "" : `?key=${CFG.apiKey}`;
  const url = `${SHEETS_URL(CFG.sheetId)}/values/${encodeURIComponent(range)}${keyParam}`;
  const r = await fetch(url, { headers });
  if (r.status === 401) {
    // Token expired — clear it and ask user to re-auth
    CFG.accessToken = null;
    localStorage.setItem(CFG_KEY, JSON.stringify(CFG));
    showToast("Sessão expirada. Clique em Reconectar.", true);
    renderReconnectBtn();
    throw new Error("Token expired");
  }
  if (!r.ok) throw new Error(await r.text());
  const d = await r.json();
  return d.values || [];
}

async function sheetsWrite(range, values) {
  const url = `${SHEETS_URL(CFG.sheetId)}/values/${encodeURIComponent(range)}?valueInputOption=USER_ENTERED&key=${CFG.apiKey}`;
  const r = await fetch(url, {
    method: "PUT",
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${CFG.accessToken}` },
    body: JSON.stringify({ values })
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function sheetsClear(range) {
  const url = `${SHEETS_URL(CFG.sheetId)}/values/${encodeURIComponent(range)}:clear?key=${CFG.apiKey}`;
  await fetch(url, { method: "POST", headers: { "Authorization": `Bearer ${CFG.accessToken}` } });
}

// OAuth2 PKCE flow
async function signInGoogle() {
  const clientId = CFG.clientId;
  const redirect = window.location.origin + window.location.pathname;
  const scope = "https://www.googleapis.com/auth/spreadsheets";
  const state = Math.random().toString(36).slice(2);
  localStorage.setItem("oauth_state", state);
  const url = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${clientId}&redirect_uri=${encodeURIComponent(redirect)}&response_type=token&scope=${encodeURIComponent(scope)}&state=${state}`;
  window.location.href = url;
}

function handleOAuthCallback() {
  const hash = window.location.hash.slice(1);
  if (!hash.includes("access_token")) return false;
  const params = new URLSearchParams(hash);
  const token = params.get("access_token");
  const state = params.get("state");
  if (state !== localStorage.getItem("oauth_state")) return false;
  CFG.accessToken = token;
  localStorage.setItem(CFG_KEY, JSON.stringify(CFG));
  window.history.replaceState({}, "", window.location.pathname);
  return true;
}

// ═══════════════════════════════════════════════════════
// DATA HELPERS
// ═══════════════════════════════════════════════════════
const todayStr = () => new Date().toISOString().split("T")[0];
const uid = () => Math.random().toString(36).slice(2,9);
const daysDiff = d => d ? Math.round((new Date(d+"T00:00:00") - new Date(todayStr()+"T00:00:00")) / 86400000) : null;
const fmtD = d => { if(!d)return"—"; const[y,m,day]=d.split("-"); return`${day}/${m}`; };
const fmtDFull = d => { if(!d)return"—"; const[y,m,day]=d.split("-"); return`${day}/${m}/${y}`; };
const proxData = item => { if(!item.ultima)return null; const d=new Date(item.ultima+"T00:00:00"); d.setDate(d.getDate()+item.freq); return d.toISOString().split("T")[0]; };
function gSt(item){ if(!item.ultima)return"sem"; const p=new Date(item.ultima+"T00:00:00"); p.setDate(p.getDate()+item.freq); const d=daysDiff(p.toISOString().split("T")[0]); if(d<0)return"at"; if(d<=3)return"eb"; return"ok"; }

// SHEETS SYNC
// ═══════════════════════════════════════════════════════
let syncing = false;
let lastSync = null;

async function syncToSheets() {
  if (!CFG.sheetId || !CFG.accessToken) return;
  syncing = true; renderSyncBtn();
  try {
    // Serialise each section as JSON in a single cell per sheet tab
    const sections = [
      ["Inbox!A1",    [[JSON.stringify(D.inbox)]]],
      ["Ações!A1",    [[JSON.stringify(D.acoes)]]],
      ["Projetos!A1", [[JSON.stringify(D.projetos)]]],
      ["Rotina!A1",   [[JSON.stringify(D.rotina)]]],
      ["Config!A1",   [[JSON.stringify({ revisao:D.revisao, contextos:D.contextos, agua:D.agua })]]],
    ];
    for (const [range, values] of sections) {
      await sheetsWrite(range, values);
    }
    lastSync = new Date();
    showToast("Sincronizado com o Google Sheets ✓");
  } catch(e) {
    console.error(e);
    if (e.message && e.message.includes("401")) {
      CFG.accessToken = null;
      localStorage.setItem(CFG_KEY, JSON.stringify(CFG));
      renderReconnectBtn();
      showToast("Sessão expirada. Clique em Reconectar.", true);
    } else {
      showToast("Erro ao sincronizar: " + e.message, true);
    }
  }
  syncing = false; renderSyncBtn();
}

async function syncFromSheets() {
  if (!CFG.sheetId || !CFG.apiKey) return;
  syncing = true; renderSyncBtn();
  try {
    const load = async (range) => {
      const rows = await sheetsGet(range);
      return rows.length && rows[0].length ? JSON.parse(rows[0][0]) : null;
    };
    const inbox    = await load("Inbox!A1");
    const acoes    = await load("Ações!A1");
    const projetos = await load("Projetos!A1");
    const rotina   = await load("Rotina!A1");
    const config   = await load("Config!A1");

    if (inbox)    D.inbox    = inbox;
    if (acoes)    D.acoes    = acoes;
    if (projetos) D.projetos = projetos;
    if (rotina)   D.rotina   = rotina;
    if (config) {
      if (config.revisao)   D.revisao   = config.revisao;
      if (config.contextos) D.contextos = config.contextos;
      if (config.agua)      D.agua      = config.agua;
    }
    saveLocal();
    lastSync = new Date();
    showToast("Dados atualizados do Google Sheets ✓");
    render();
  } catch(e) {
    console.error(e);
    showToast("Erro ao carregar. Usando dados locais.", true);
  }
  syncing = false; renderSyncBtn();
}

// Auto-sync a cada 5min se tiver token
setInterval(() => { if(CFG.accessToken) syncToSheets(); }, 5*60*1000);

let toastTimer;
function showToast(msg, isErr=false) {
  let t = document.getElementById("toast");
  if (!t) { t=document.createElement("div"); t.id="toast"; document.body.appendChild(t); }
  t.textContent = msg;
  t.style.cssText = `position:fixed;bottom:${90+8}px;left:50%;transform:translateX(-50%);background:${isErr?"var(--redD)":"var(--grnD)"};color:${isErr?"var(--red)":"var(--grn)"};border:1px solid ${isErr?"var(--red)":"var(--grn)"};border-radius:20px;padding:7px 16px;font-size:12px;font-weight:600;z-index:999;white-space:nowrap;transition:opacity .3s;max-width:90vw;text-align:center`;
  t.style.opacity="1";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.style.opacity="0"; }, 3000);
}

function renderSyncBtn() {
  const btn = document.getElementById("sync-btn");
  if (!btn) return;
  btn.className = "sync-btn" + (syncing ? " syncing" : "");
  btn.innerHTML = `<span aria-hidden="true">🔄</span>`;
  btn.title = lastSync ? `Última sync: ${lastSync.toLocaleTimeString()}` : "Sincronizar";
}

function renderReconnectBtn() {
  if (document.getElementById("reconnect-bar")) return;
  const bar = document.createElement("div");
  bar.id = "reconnect-bar";
  bar.style.cssText = "position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--redD);border-bottom:1px solid var(--red);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;z-index:50;gap:8px";
  bar.innerHTML = `<span style="font-size:12px;color:var(--red);font-weight:600">Sessão expirada — reconecte para sincronizar</span>
    <button onclick="reauth()" style="background:var(--red);color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0">Reconectar</button>`;
  document.getElementById("app").prepend(bar);
}

window.reauth = () => {
  const bar = document.getElementById("reconnect-bar");
  if (bar) bar.remove();
  signInGoogle();
};

function pill(cls, txt) { return `<span class="pill ${cls}">${txt}</span>`; }

function el(tag, attrs={}, ...children) {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === "onclick") e.onclick = v;
    else if (k === "onchange") e.onchange = v;
    else if (k === "class") e.className = v;
    else e.setAttribute(k, v);
  }
  for (const c of children) {
    if (typeof c === "string") e.insertAdjacentHTML("beforeend", c);
    else if (c) e.appendChild(c);
  }
  return e;
}

function renderRotina(ct) {
  const stMap={"Atrasada":"at","Em breve":"eb","Em dia":"ok","Sem registro":"sem"};
  const filt=D.rotina.filter(r=>(rotCat==="Todas"||r.cat===rotCat)&&(rotSt==="Todos"||gSt(r)===stMap[rotSt]));
  const at=filt.filter(r=>gSt(r)==="at"),eb=filt.filter(r=>gSt(r)==="eb"),ok=filt.filter(r=>gSt(r)==="ok"),sr=filt.filter(r=>gSt(r)==="sem");
  const ord=[...at,...eb,...sr,...ok];
  ct.innerHTML=`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <div class="chips" style="margin:0;flex:1">
      ${["Todas","Beleza","Casa","Lavanderia","Dogs"].map(c=>`<button class="chip${rotCat===c?" on":""}" onclick="setRC('${c}')">${c}</button>`).join("")}
    </div>
    <button class="btn btn-p btn-sm" style="margin-left:8px;flex-shrink:0" onclick="openModal('rotina-new')">+</button>
  </div>
  <div class="chips">
    ${["Todos","Atrasada","Em breve","Em dia","Sem registro"].map(f=>`<button class="chip${rotSt===f?" on":""}" onclick="setRS('${f}')">${f}</button>`).join("")}
  </div>
  <div class="row" style="margin-bottom:12px">
    ${pill("p-red","🔴 "+at.length)}${pill("p-amb","🟡 "+eb.length)}${pill("p-grn","🟢 "+ok.length)}${pill("p-gray","⚪ "+sr.length)}
  </div>
  ${ord.map(r=>{
    const st=gSt(r);const si=stInfo[st];const prox=proxData(r);const diff=prox?daysDiff(prox):null;
    const diffTxt=diff!==null?(diff<0?`${Math.abs(diff)}d atrás`:`em ${diff}d`):"";
    const [cc]=catInfo[r.cat]||["p-gray"];
    return `<div class="card card-l" style="border-left-color:${si.c};padding:10px 13px">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="flex:1">
          <div class="iname" style="margin-bottom:3px">${r.nome}</div>
          <div class="row">${pill(cc,r.cat)}${pill(si.cls,si.l)}<span class="imeta">🔁 ${r.freq}d · ⏱ ${r.tempo}</span>${prox?`<span class="imeta" style="color:${si.c}">📅 ${diffTxt}</span>`:""}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px">
          <button class="btn btn-grn btn-sm" onclick="marcarFeita('${r.id}')">✓ Feita</button>
          <div style="display:flex;gap:4px">
            <button onclick="startPomo('rotina','${r.id}',this)" style="flex:1;background:${PM.taskId===r.id?"var(--grnD)":"var(--redD)"};color:${PM.taskId===r.id?"var(--grn)":"var(--red)"};border:1px solid ${PM.taskId===r.id?"var(--grn)":"var(--red)"};border-radius:var(--r-sm);padding:4px 7px;font-size:12px;cursor:pointer">${PM.taskId===r.id?"▶":"🍅"}</button>
            <button class="btn btn-g btn-sm" onclick="openModal('rot-edit','${r.id}')">📅</button>
            <button class="btn btn-g btn-sm" onclick="openModal('rotina-edit-full','${r.id}')">✏️</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join("")}`;
}
window.setRC=c=>{rotCat=c;render();};
window.setRS=f=>{rotSt=f;render();};

// ═══════════════════════════════════════════════════════
const revSecs=[
  {sec:"Limpar",items:["Esvaziar bolsos, bolsa e mochila","Processar papéis físicos","Esvaziar o Inbox completamente","Processar e-mails pendentes"]},
  {sec:"Atualizar",items:["Revisar calendário da semana passada","Revisar próximas 2 semanas","Atualizar Próximas Ações","Revisar lista de Projetos"]},
  {sec:"Revisar",items:["Revisar Someday/Maybe","Verificar se projetos têm próxima ação","Checar prazos dos próximos 30 dias","Status da Rotina — tem atrasadas?"]},
  {sec:"Planejar",items:["Definir 3 prioridades da semana","Alocar tempo para projetos críticos","Criar próximas ações necessárias","Celebrar o que foi concluído! 🎉"]},
];
const allRevItens=revSecs.flatMap(s=>s.items);

function renderRevisao(ct) {
  const chk=D.revisao||[];
  const done=chk.filter(Boolean).length;
  const pct=Math.round(done/allRevItens.length*100);
  let gi=0;
  ct.innerHTML=`
  <div class="card" style="margin-bottom:12px">
    <div class="rowb" style="margin-bottom:6px"><span style="font-weight:600">${done} / ${allRevItens.length}</span><span style="font-size:13px;font-weight:600;color:var(--acc)">${pct}%</span></div>
    <div class="pbar"><div class="pfill" style="width:${pct}%;background:linear-gradient(90deg,var(--acc),var(--pink))"></div></div>
    ${done===allRevItens.length?`<div style="margin-top:8px;color:var(--grn);font-weight:600;text-align:center">🎉 Revisão concluída!</div>`:""}
  </div>
  <div style="text-align:right;margin-bottom:10px"><button class="btn btn-g btn-sm" onclick="resetRev()">Reiniciar</button></div>
  ${revSecs.map(s=>`
  <div style="margin-bottom:14px">
    <div class="sec">${s.sec}</div>
    ${s.items.map(item=>{const idx=gi++;const d=chk[idx];return`<div class="ci${d?" done":""}" onclick="togRev(${idx})"><div class="cbox${d?" tk":""}">✓</div><span style="font-size:13px">${item}</span></div>`;}).join("")}
  </div>`).join("")}
  <div class="sec">Métricas</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    ${[[D.inbox.filter(i=>!i.proc).length,"Inbox pendente","var(--amb)"],[D.acoes.filter(a=>a.status==="Pendente").length,"Ações pend.","var(--acc)"],[D.projetos.filter(p=>p.status==="Ativo").length,"Proj. ativos","var(--pink)"],[D.rotina.filter(r=>gSt(r)==="at").length,"Rotina atrasada","var(--red)"]].map(([v,l,c])=>`<div class="stat"><div class="v" style="color:${c}">${v}</div><div class="l">${l}</div></div>`).join("")}
  </div>`;
}
window.togRev=i=>setState(()=>{if(!D.revisao)D.revisao=Array(allRevItens.length).fill(false);D.revisao[i]=!D.revisao[i];});
window.resetRev=()=>setState(()=>{D.revisao=Array(allRevItens.length).fill(false);});

// ALARM AUDIO ENGINE (Web Audio API — sem arquivos externos)
// ═══════════════════════════════════════════════════════
let _audioCtx = null;
let _audioUnlocked = false;

function getAudioCtx(){
  if(!_audioCtx){
    try { _audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ console.warn("AudioContext not available", e); return null; }
  }
  return _audioCtx;
}

async function resumeAudio(){
  const ctx = getAudioCtx();
  if(!ctx) return false;
  if(ctx.state === "suspended"){
    try { await ctx.resume(); } catch(e){ return false; }
  }
  _audioUnlocked = ctx.state === "running";
  return _audioUnlocked;
}

function playTone(freq, startTime, duration, vol=0.55, type="triangle"){
  const ctx = getAudioCtx();
  if(!ctx || ctx.state !== "running") return;
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, startTime);
    gain.gain.setValueAtTime(0.001, startTime);
    gain.gain.linearRampToValueAtTime(vol, startTime + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration - 0.01);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.05);
  } catch(e){ console.warn("playTone error", e); }
}

// 🍅 Alarme de FOCO concluído
async function playAlarmWork(){
  const ok = await resumeAudio();
  if(!ok){ showToast("⏰ Pomodoro concluído! (ative o som nas configurações do celular)"); return; }
  const ctx = getAudioCtx();
  const t = ctx.currentTime + 0.05;
  playTone(523.25, t,        0.18, 0.5, "triangle");
  playTone(659.25, t + 0.2,  0.18, 0.5, "triangle");
  playTone(783.99, t + 0.4,  0.25, 0.5, "triangle");
  playTone(1046.5, t + 0.65, 0.4,  0.45,"triangle");
  setTimeout(()=>{
    const t2 = getAudioCtx().currentTime + 0.05;
    playTone(783.99, t2,       0.15, 0.35, "sine");
    playTone(1046.5, t2 + 0.2, 0.35, 0.4,  "sine");
  }, 1200);
}

// ☕ Alarme de PAUSA concluída
async function playAlarmBreak(){
  const ok = await resumeAudio();
  if(!ok){ showToast("☕ Pausa concluída! (ative o som nas configurações do celular)"); return; }
  const ctx = getAudioCtx();
  const t = ctx.currentTime + 0.05;
  playTone(659.25, t,       0.22, 0.4, "sine");
  playTone(587.33, t + 0.28,0.22, 0.4, "sine");
  playTone(523.25, t + 0.56,0.35, 0.45,"sine");
  setTimeout(()=>{
    const t2 = getAudioCtx().currentTime + 0.05;
    playTone(523.25, t2, 0.5, 0.3, "sine");
  }, 1100);
}

// Unlock: resume AudioContext on ANY user interaction
async function unlockAudio(){
  if(_audioUnlocked) return;
  await resumeAudio();
}
document.addEventListener("touchstart", unlockAudio, {passive:true});
document.addEventListener("touchend",   unlockAudio, {passive:true});
document.addEventListener("click",      unlockAudio, {passive:true});
document.addEventListener("keydown",    unlockAudio, {passive:true});

// Helper: render QR to canvas
function renderQRToCanvas(text, canvas, size) {
  const qr = QRCode.createQRCode(text);
  const count = qr.getModuleCount();
  const cell = Math.floor(size / count);
  const margin = Math.floor((size - cell * count) / 2);
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = "#000000";
  for (let r = 0; r < count; r++) {
    for (let c2 = 0; c2 < count; c2++) {
      if (qr.isDark(r, c2)) {
        ctx.fillRect(margin + c2 * cell, margin + r * cell, cell, cell);
      }
    }
  }
}

// ═══════════════════════════════════════════════════════
// POMODORO ENGINE
// ═══════════════════════════════════════════════════════
const POMO_CFG_KEY = "gtd_pomo_cfg";
let POMO_CFG = { work:25, shortBreak:5, longBreak:15, longAfter:4 };
try { POMO_CFG = {...POMO_CFG,...JSON.parse(localStorage.getItem(POMO_CFG_KEY)||"{}")}; } catch {}
function savePromoCfg(){ localStorage.setItem(POMO_CFG_KEY, JSON.stringify(POMO_CFG)); }

// PM = Pomodoro Machine state
const PM = {
  taskId: null,       // ID da tarefa ativa
  taskType: null,     // "acao" | "rotina" | "proj"
  taskName: "",
  phase: "idle",      // "idle" | "work" | "break" | "longBreak"
  elapsed: 0,         // segundos decorridos nesta fase
  totalSecs: 0,       // total da fase
  roundsDone: 0,      // pomodoros completos nesta sessão
  panelOpen: false,
  _timer: null,
};

function pomoTotalSecs(){
  if(PM.phase==="work") return POMO_CFG.work*60;
  if(PM.phase==="longBreak") return POMO_CFG.longBreak*60;
  return POMO_CFG.shortBreak*60;
}

function pomoSecsLeft(){ return Math.max(0, PM.totalSecs - PM.elapsed); }

function pomoFmt(s){ const m=Math.floor(s/60); const ss=s%60; return `${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`; }

function startPomo(type, id, btn){
  // If same task, just open panel
  if(PM.taskId===id){ PM.panelOpen=true; renderPomoPanel(); return; }
  // If different task running, ask
  if(PM.phase!=="idle"){
    if(!confirm("Há um pomodoro em andamento. Trocar de tarefa?")) return;
    pomoStop(false);
  }
  const item = type==="acao"?D.acoes.find(a=>a.id===id):type==="rotina"?D.rotina.find(r=>r.id===id):D.projetos.find(p=>p.id===id);
  if(!item) return;
  PM.taskId=id; PM.taskType=type; PM.taskName=type==="acao"?item.acao:type==="rotina"?item.nome:item.nome;
  PM.phase="work"; PM.elapsed=0; PM.totalSecs=POMO_CFG.work*60; PM.roundsDone=0; PM.panelOpen=true;
  pomoTick();
  renderPomoFab(); renderPomoPanel();
}
window.startPomo = startPomo;

function pomoTick(){
  clearInterval(PM._timer);
  PM._timer = setInterval(()=>{
    PM.elapsed++;
    if(PM.elapsed>=PM.totalSecs){
      pomoPhaseComplete();
    } else {
      renderPomoPanel();
      renderPomoFab();
    }
  },1000);
}

function pomoPhaseComplete(){
  clearInterval(PM._timer);
  if(PM.phase==="work"){
    PM.roundsDone++;
    // Play work-complete alarm 🍅
    playAlarmWork();
    // Save pomodoro count to item
    setState(()=>{
      const item = PM.taskType==="acao"?D.acoes.find(a=>a.id===PM.taskId):PM.taskType==="rotina"?D.rotina.find(r=>r.id===PM.taskId):D.projetos.find(p=>p.id===PM.taskId);
      if(item){
        item.pomodoros=(item.pomodoros||0)+1;
        if(!item.pomoHist) item.pomoHist=[];
        item.pomoHist.push({data:todayStr(),hora:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})});
      }
    });
    // Vibrate
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
    // Notification
    if(Notification.permission==="granted") new Notification("🍅 Pomodoro completo!",{body:`${PM.taskName} — Hora da pausa!`,icon:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍅</text></svg>"});
    // Start break
    const isLong = PM.roundsDone%POMO_CFG.longAfter===0;
    PM.phase=isLong?"longBreak":"break";
    PM.elapsed=0; PM.totalSecs=isLong?POMO_CFG.longBreak*60:POMO_CFG.shortBreak*60;
    showToast(isLong?"Pausa longa! Descanse "+POMO_CFG.longBreak+" min 🧘":"Pausa curta! "+POMO_CFG.shortBreak+" min ☕");
  } else {
    // Break done → back to work — play break-complete alarm ☕
    playAlarmBreak();
    if(navigator.vibrate) navigator.vibrate(100);
    PM.phase="work"; PM.elapsed=0; PM.totalSecs=POMO_CFG.work*60;
    showToast("Hora de focar! 🍅 Pomodoro "+( PM.roundsDone+1));
  }
  pomoTick(); renderPomoPanel(); renderPomoFab();
}

function pomoStop(doRender=true){
  clearInterval(PM._timer);
  PM.phase="idle"; PM.taskId=null; PM.taskType=null; PM.taskName=""; PM.elapsed=0; PM.roundsDone=0;
  if(doRender){ renderPomoFab(); renderPomoPanel(); render(); }
}
window.pomoStop = pomoStop;

function pomoPause(){
  if(PM._timer){ clearInterval(PM._timer); PM._timer=null; }
  else { pomoTick(); }
  renderPomoPanel(); renderPomoFab();
}
window.pomoPause = pomoPause;

function pomoSkip(){
  clearInterval(PM._timer);
  if(PM.phase==="work"){
    PM.roundsDone++;
    const isLong=PM.roundsDone%POMO_CFG.longAfter===0;
    PM.phase=isLong?"longBreak":"break"; PM.elapsed=0; PM.totalSecs=isLong?POMO_CFG.longBreak*60:POMO_CFG.shortBreak*60;
  } else {
    PM.phase="work"; PM.elapsed=0; PM.totalSecs=POMO_CFG.work*60;
  }
  pomoTick(); renderPomoPanel(); renderPomoFab();
}
window.pomoSkip = pomoSkip;

function pomoTogglePanel(){ PM.panelOpen=!PM.panelOpen; renderPomoPanel(); }
window.pomoTogglePanel = pomoTogglePanel;

function renderPomoFab(){
  let fab = document.getElementById("pomo-fab");
  if(!fab){ fab=document.createElement("button"); fab.id="pomo-fab"; document.body.appendChild(fab); }
  if(PM.phase==="idle"){ fab.style.display="none"; return; }
  fab.style.display="flex";
  fab.className="pomo-fab"+(PM.phase!=="work"?" break":"")+(PM._timer?" running":"");
  const left=pomoSecsLeft();
  fab.innerHTML=PM.phase==="work"?"🍅":PM.phase==="longBreak"?"🧘":"☕";
  fab.title=pomoFmt(left)+" restantes";
  fab.onclick=pomoTogglePanel;
}

function renderPomoPanel(){
  let panel = document.getElementById("pomo-panel");
  if(!panel){ panel=document.createElement("div"); panel.id="pomo-panel"; document.body.appendChild(panel); }
  panel.className="pomo-panel"+(PM.panelOpen?"":" hidden");
  if(PM.phase==="idle"){ panel.className="pomo-panel hidden"; return; }

  const left=pomoSecsLeft(); const total=PM.totalSecs;
  const pct=Math.max(0,Math.min(1,(total-left)/total));
  const R=60; const circ=2*Math.PI*R;
  const offset=circ*(1-pct);
  const stroke=PM.phase==="work"?"var(--red)":PM.phase==="longBreak"?"var(--acc)":"var(--amb)";
  const phaseLabel=PM.phase==="work"?"FOCO":PM.phase==="longBreak"?"PAUSA LONGA":"PAUSA";
  const isPaused=!PM._timer;

  // Dots for pomodoro count
  const target=POMO_CFG.longAfter;
  const dots=Array.from({length:target},(_,i)=>
    `<div class="pomo-dot${i<PM.roundsDone%target?" done":""}" title="Pomodoro ${i+1}"></div>`
  ).join("");

  // History for this task
  const item = PM.taskType==="acao"?D.acoes.find(a=>a.id===PM.taskId):PM.taskType==="rotina"?D.rotina.find(r=>r.id===PM.taskId):D.projetos.find(p=>p.id===PM.taskId);
  const hist = item?.pomoHist||[];
  const histHtml = hist.length?`
    <div class="sec" style="margin-top:10px">Histórico desta tarefa</div>
    <div class="pomo-hist">
      ${[...hist].reverse().slice(0,10).map((h,i)=>`
      <div class="pomo-hist-item">
        <span style="color:var(--mid)">${h.data} ${h.hora}</span>
        <span style="color:var(--red)">🍅 #${hist.length-i}</span>
      </div>`).join("")}
    </div>`:"";

  panel.innerHTML=`
    <div class="modal-handle" onclick="pomoTogglePanel()" style="cursor:pointer"></div>
    <div class="pomo-task">${PM.taskName}</div>
    <div class="pomo-ring-wrap">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <circle class="pomo-ring-bg" cx="70" cy="70" r="${R}"/>
        <circle class="pomo-ring-fill" cx="70" cy="70" r="${R}"
          stroke="${stroke}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/>
      </svg>
      <div class="pomo-time">
        <span class="t" style="color:${stroke}">${pomoFmt(left)}</span>
        <span class="lbl">${phaseLabel}</span>
      </div>
    </div>
    <div class="pomo-count">${dots}<span style="font-size:11px;color:var(--mid);margin-left:4px">${PM.roundsDone} pomodoro${PM.roundsDone!==1?"s":""} hoje</span></div>
    <div class="pomo-controls">
      <button class="btn btn-g" onclick="pomoStop()" title="Parar">⏹</button>
      <button class="btn" style="background:${stroke};color:#fff;min-width:80px" onclick="pomoPause()">${isPaused?"▶ Retomar":"⏸ Pausar"}</button>
      <button class="btn btn-g" onclick="pomoSkip()" title="Pular fase">⏭</button>
    </div>
    <div style="text-align:center;margin-bottom:6px">
      <button class="btn btn-g btn-sm" onclick="openModal('pomo-cfg')"><span aria-hidden="true">⚙️</span> Configurar</button>
    </div>
    ${histHtml}
  `;
}

// ── Pomo config modal ──────────────────────────────────
// (injected into renderModal)

// Request notification permission on first load
if(Notification.permission==="default") Notification.requestPermission();

// ═══════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════
(async function boot(){
  // Handle ?cfg= param — auto-fill config from QR/link
  const urlParams = new URLSearchParams(window.location.search);
  const cfgParam = urlParams.get("cfg");
  if(cfgParam && !CFG.sheetId){
    try{
      const decoded = JSON.parse(decodeURIComponent(escape(atob(cfgParam))));
      CFG = {...CFG, ...decoded};
      localStorage.setItem(CFG_KEY, JSON.stringify(CFG));
      // Clean URL
      window.history.replaceState({}, "", window.location.pathname);
      showToast && showToast("Configuração importada! Clique em Salvar e Autorizar.");
    } catch(e){ console.warn("cfg param error", e); }
  }

  // Handle OAuth callback
  if (window.location.hash.includes("access_token")) {
    handleOAuthCallback();
    await syncFromSheets();
  }
  render();
  // Auto-load from sheets on open
  if (CFG.sheetId && CFG.apiKey && CFG.clientId) {
    if (!CFG.accessToken) {
      setTimeout(renderReconnectBtn, 500);
    } else {
      setTimeout(syncFromSheets, 500);
    }
    // Always show the 📲 export FAB after config is done
    setTimeout(renderExportFab, 600);
  }
})();

function renderExportFab(){
  if(document.getElementById("export-fab")) return;
  const fab = document.createElement("button");
  fab.id = "export-fab";
  fab.title = "Configurar outro dispositivo";
  fab.textContent = "📲";
  fab.style.cssText = "position:fixed;bottom:calc(86px + 56px);right:calc(50% - 215px + 12px);width:44px;height:44px;border-radius:50%;background:var(--accD);color:var(--acc);border:1.5px solid var(--acc);font-size:20px;cursor:pointer;z-index:49;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(108,142,245,.3)";
  fab.onclick = () => openModal("export-cfg");
  document.body.appendChild(fab);
}
</script>
